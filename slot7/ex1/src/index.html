<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Exercises</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- ===== Bài 3: Navbar ===== -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">MyWebsite</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
        data-bs-target="#navbarNav" aria-controls="navbarNav"
        aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">About</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Services</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ===== Bài 4: Grid Layout ===== -->
  <div class="container mt-4">
    <h2 class="text-center mb-4">Bài 4 - Grid Layout</h2>
    <div class="row">
      <div class="col-md-4 bg-light p-3 border">Cột 1</div>
      <div class="col-md-4 bg-secondary text-white p-3 border">Cột 2</div>
      <div class="col-md-4 bg-light p-3 border">Cột 3</div>
    </div>
  </div>

  <!-- ===== Bài 5: Card Component ===== -->
  <div class="container mt-5">
    <h2 class="text-center mb-4">Bài 5 - Card Component</h2>
    <div class="row g-4">
      <div class="col-md-4">
        <div class="card">
          <img src="https://via.placeholder.com/300" class="card-img-top" alt="Card1">
          <div class="card-body">
            <h5 class="card-title">Card 1</h5>
            <p class="card-text">Mô tả ngắn gọn cho card 1.</p>
            <a href="#" class="btn btn-primary">Chi tiết</a>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card">
          <img src="https://via.placeholder.com/300" class="card-img-top" alt="Card2">
          <div class="card-body">
            <h5 class="card-title">Card 2</h5>
            <p class="card-text">Mô tả ngắn gọn cho card 2.</p>
            <a href="#" class="btn btn-primary">Chi tiết</a>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card">
          <img src="https://via.placeholder.com/300" class="card-img-top" alt="Card3">
          <div class="card-body">
            <h5 class="card-title">Card 3</h5>
            <p class="card-text">Mô tả ngắn gọn cho card 3.</p>
            <a href="#" class="btn btn-primary">Chi tiết</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
